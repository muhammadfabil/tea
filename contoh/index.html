<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Push Notification Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.5;
    }

    h1 {
      color: #333;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    .btn-container {
      margin: 20px 0;
    }

    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-right: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    #notification {
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
      display: none;
    }

    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .info-box {
      background-color: #f8f9fa;
      border-left: 4px solid #17a2b8;
      padding: 15px;
      margin: 20px 0;
    }
  </style>
</head>

<body>
  <h1>Web Push Notification Demo</h1>

  <div id="notification"></div>

  <div class="info-box">
    <p><strong>How it works:</strong></p>
    <ol>
      <li>Click "Subscribe to Notifications" and allow notification permissions when prompted</li>
      <li>Once subscribed, you can test by clicking "Send Test Notification"</li>
      <li>You can unsubscribe anytime using the "Unsubscribe" button</li>
    </ol>
  </div>

  <div class="btn-container">
    <button id="subscribe-button">Subscribe to Notifications</button>
    <button id="unsubscribe-button" disabled>Unsubscribe</button>
    <button id="send-notification-button" disabled>Send Test Notification</button>
  </div>

  <script src="app.js"></script>
</body>

</html>
